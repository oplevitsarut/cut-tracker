<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cut Tracker">
<title>Cut Tracker</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#16181d; --muted:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --good:#16a34a; --bad:#dc2626; --warn:#d97706; --soft:#eef2ff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --card:#181b21; --text:#eef0f3; --muted:#9aa1ac; --line:#2a2f38;
    --accent:#60a5fa; --good:#4ade80; --bad:#f87171; --warn:#fbbf24; --soft:#1e2533; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .v{font-size:22px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:var(--soft);color:var(--accent)}
button.small{padding:6px 10px;font-size:13px}
ul.list{list-style:none;margin:8px 0 0;padding:0}
ul.list li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.x{background:none;color:var(--muted);padding:4px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:12px 4px;font-size:13px}
nav button.on{color:var(--accent)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar > div{height:100%;background:var(--accent)}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font-size:10px}
.day{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.day input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none}
.day .name{font-weight:600}
.today{background:var(--soft);border-radius:8px;padding:10px 8px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 14px;border-radius:10px;font-size:14px;z-index:9;opacity:0;transition:opacity .3s}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}
.hidden{display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal .h{color:var(--muted);font-size:11px;padding-bottom:2px}
.cal .c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--bg)}
.cal .hit{background:var(--good);color:#fff;font-weight:600}
.cal .miss{background:var(--bad);color:#fff;opacity:.85}
.cal .rest{color:var(--muted)}
.cal .now{outline:2px solid var(--accent)}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.big{width:100%;padding:16px;font-size:17px;border-radius:12px}
.big.done{background:var(--good)}
.big.stop{background:var(--bad)}
.timer{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
</style>
</head>
<body>
<main>
  <section id="tab-dash"></section>
  <section id="tab-log" class="hidden"></section>
  <section id="tab-plan" class="hidden"></section>
  <section id="tab-fast" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
</main>
<nav>
  <button data-tab="dash" class="on">Home</button>
  <button data-tab="log">Log</button>
  <button data-tab="plan">Workout</button>
  <button data-tab="fast">Fasting</button>
  <button data-tab="settings">Settings</button>
</nav>
<div class="toast" id="toast"></div>

<script>
// ---------- Storage ----------
const KEY = 'cuttracker.v1';
const DEFAULT_PLAN = [
  {name:'Zone 2 jog', detail:'35 min easy, able to talk in full sentences', type:'z2', min:35},
  {name:'Strength A', detail:'Squat, push-up/bench, row, plank. 3 sets of 8-12', type:'strength'},
  {name:'Zone 2 jog', detail:'40 min easy', type:'z2', min:40},
  {name:'Strength B', detail:'Deadlift/hinge, overhead press, pulldown, lunges. 3 sets of 8-12', type:'strength'},
  {name:'Rest or walk', detail:'Optional 30 min walk', type:'rest'},
  {name:'Long zone 2 jog', detail:'50-60 min easy', type:'z2', min:50, long:true},
  {name:'Rest', detail:'Recovery day', type:'rest'},
]; // Monday first
const today = () => iso(new Date());
function iso(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function addDays(s,n){ const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function dnum(s){ return new Date(s+'T12:00:00').getTime()/864e5; }
function load(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s) s={};
  s.settings = Object.assign({sex:'male', age:25, height:177, startWeight:113.5, goalWeight:83.5,
    startDate:'2026-11-03', targetDate:'2027-05-03', activity:1.2, calorieTarget:'', proteinTarget:''}, s.settings||{});
  s.days = s.days||{}; s.plan = s.plan||DEFAULT_PLAN.map(p=>({...p})); s.plan.forEach((p,i)=>{ const d=DEFAULT_PLAN[i]; if(p.min===undefined && d && d.min && p.name===d.name && p.detail===d.detail){ p.min=d.min; if(d.long) p.long=true; } });
  s.runs = s.runs||{};
  s.done = s.done||{}; s.fasts = s.fasts||[]; if(s.fastStart===undefined) s.fastStart=null;
  if(!s.settings.age) s.settings.age=25;
  return s;
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Could not save on this device'); } }
function day(d){ return S.days[d] || (S.days[d]={meals:[],workouts:[]}); }

// ---------- Maths ----------
const KCAL_PER_KG = 7700;
const age = () => +S.settings.age || 25;
function bmr(w){ const st=S.settings; return 10*w + 6.25*(+st.height) - 5*age() + (st.sex==='male'?5:-161); }
function tdee(w){ return bmr(w) * (+S.settings.activity||1.2); }
function sortedDates(){ return Object.keys(S.days).sort(); }
function weightOn(d){ // latest weight on or before d
  let w=null; for(const k of sortedDates()){ if(k>d) break; if(S.days[k].weight) w=+S.days[k].weight; }
  return w ?? +S.settings.startWeight;
}
function currentWeight(){ return weightOn(today()); }
function minKcal(){ return S.settings.sex==='male'?1500:1200; }
function calorieTarget(){
  if(+S.settings.calorieTarget) return +S.settings.calorieTarget;
  return Math.max(minKcal(), Math.round((tdee(currentWeight())-750)/50)*50);
}
function proteinTarget(){ return +S.settings.proteinTarget || Math.round(1.6*(+S.settings.goalWeight)/5)*5; }
function eaten(d){ const x=S.days[d]; return x? x.meals.reduce((a,m)=>a+(+m.kcal||0),0):0; }
function protein(d){ const x=S.days[d]; return x? x.meals.reduce((a,m)=>a+(+m.protein||0),0):0; }
function exerciseKcal(d){ // Health active energy wins, otherwise logged workouts
  const x=S.days[d]; if(!x) return 0;
  if(x.active!=null && x.active!=='') return +x.active;
  return x.workouts.reduce((a,w)=>a+(+w.kcal||0),0);
}
function burned(d){ return Math.round(tdee(weightOn(d)) + exerciseKcal(d)); }
function deficit(d){ const x=S.days[d]; if(!x||!x.meals.length) return null; return burned(d)-eaten(d); }
function runsOn(d){ return Object.values(S.runs||{}).filter(r=>r.date===d); }
function z2Minutes(d){ const x=S.days[d]; const logged=x? x.workouts.filter(w=>w.type==='z2').reduce((a,w)=>a+(+w.minutes||0),0):0;
  const strava=runsOn(d).reduce((a,r)=>a+r.secs/60,0); return Math.round(Math.max(logged,strava)); }
function zone2Range(){ const max=220-age(); return [Math.round(max*.6), Math.round(max*.7)]; }
function weightSeries(){ return sortedDates().filter(d=>S.days[d].weight).map(d=>({d, y:+S.days[d].weight})); }
function trend(series){ // 7-day moving average by date
  return series.map(p=>{ const w=series.filter(q=>dnum(q.d)<=dnum(p.d) && dnum(q.d)>dnum(p.d)-7);
    return {d:p.d, y:w.reduce((a,q)=>a+q.y,0)/w.length}; });
}
function weeklyRate(){ // kg per week from trend over last 28 days
  const t=trend(weightSeries()); if(t.length<2) return null;
  const last=t[t.length-1]; const first=t.find(p=>dnum(p.d)>=dnum(last.d)-28)||t[0];
  const days=dnum(last.d)-dnum(first.d); if(days<6) return null;
  return (first.y-last.y)/days*7;
}
function isDone(d){ const x=S.days[d]; return S.done[d]!==undefined ? !!S.done[d] : !!((x && x.workouts.some(w=>w.type!=='other')) || runsOn(d).length); }
function workoutStatus(d){
  const i=(new Date(d+'T12:00:00').getDay()+6)%7, p=S.plan[i];
  if(isDone(d)) return 'hit';
  if(d<S.settings.startDate || d>today()) return '';
  if(p.type==='rest') return 'rest';
  return d<today()?'miss':'';
}
const FAST_H=16;
function fastsEndingOn(d){ return S.fasts.filter(f=>iso(new Date(f.end))===d); }
function longestFast(d){ return Math.max(0,...fastsEndingOn(d).map(f=>(f.end-f.start)/36e5)); }
function fastStatus(d){
  if(longestFast(d)>=FAST_H) return 'hit';
  const first=S.fasts.length? iso(new Date(Math.min(...S.fasts.map(f=>f.end)))) : null;
  if(!first || d<first || d>=today()) return '';
  return 'miss';
}
function streak(fn){ let n=0, d=today(); if(fn(d)!=='hit') d=addDays(d,-1);
  while(true){ const st=fn(d); if(st==='hit') n++; else if(st!=='rest') break; d=addDays(d,-1); if(n>999) break; } return n; }
const calMonth={plan:today().slice(0,7), fast:today().slice(0,7)};
function calendar(key, fn){
  const m=calMonth[key], first=m+'-01', start=mondayOf(first);
  const label=new Date(first+'T12:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});
  let cells=['M','T','W','T','F','S','S'].map(h=>`<div class="h">${h}</div>`).join('');
  for(let i=0;i<42;i++){ const d=addDays(start,i); if(i>=35 && d.slice(0,7)!==m) break;
    if(d.slice(0,7)!==m){ cells+='<div></div>'; continue; }
    cells+=`<div class="c ${fn(d)} ${d===today()?'now':''}">${+d.slice(8)}</div>`; }
  return `<div class="calnav"><button class="ghost small" onclick="shiftCal('${key}',-1)">‹</button><b>${label}</b><button class="ghost small" onclick="shiftCal('${key}',1)">›</button></div>
  <div class="cal">${cells}</div>
  <div class="legend"><span><i style="background:${C('--good')}"></i>Hit</span><span><i style="background:${C('--bad')}"></i>Missed</span></div>`;
}
function shiftCal(key,n){ const [y,mo]=calMonth[key].split('-').map(Number); const d=new Date(y,mo-1+n,1);
  calMonth[key]=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); key==='plan'?renderPlan():renderFast(); }
function mondayOf(d){ const x=new Date(d+'T12:00:00'); const k=(x.getDay()+6)%7; return addDays(d,-k); }

// ---------- Charts (plain SVG, works offline) ----------
const C = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function lineChart(series, {yFmt=v=>v.toFixed(0), xFrom, xTo}={}){
  const W=600,H=220,L=36,R=8,T=10,B=22;
  const pts=series.flatMap(s=>s.points); if(!pts.length) return '<p class="muted">No data yet.</p>';
  const xs=pts.map(p=>dnum(p.d)); let x0=xFrom?dnum(xFrom):Math.min(...xs), x1=xTo?dnum(xTo):Math.max(...xs);
  if(x1-x0<7) x1=x0+7;
  let y0=Math.min(...pts.map(p=>p.y)), y1=Math.max(...pts.map(p=>p.y)); const pad=Math.max(1,(y1-y0)*.1); y0-=pad; y1+=pad;
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R), Y=v=>T+(y1-v)/(y1-y0)*(H-T-B);
  let g='';
  for(let i=0;i<=4;i++){ const v=y0+(y1-y0)*i/4; g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C('--line')}"/><text x="${L-4}" y="${Y(v)+3}" text-anchor="end">${yFmt(v)}</text>`; }
  for(let i=0;i<=3;i++){ const v=x0+(x1-x0)*i/3; const d=new Date(v*864e5); g+=`<text x="${X(v)}" y="${H-6}" text-anchor="${i===0?'start':i===3?'end':'middle'}">${d.getDate()}/${d.getMonth()+1}</text>`; }
  for(const s of series){
    if(!s.points.length) continue;
    const path=s.points.map((p,i)=>(i?'L':'M')+X(dnum(p.d)).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ');
    if(s.line!==false) g+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" ${s.dash?'stroke-dasharray="5 5"':''}/>`;
    if(s.dots) g+=s.points.map(p=>`<circle cx="${X(dnum(p.d))}" cy="${Y(p.y)}" r="2.5" fill="${s.color}"/>`).join('');
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function barChart(bars, {target, fmt=v=>Math.round(v)}={}){
  const W=600,H=180,L=36,R=8,T=10,B=22;
  if(!bars.length) return '<p class="muted">No data yet.</p>';
  const vals=bars.map(b=>b.value??0).concat(target?[target]:[]);
  let y1=Math.max(0,...vals), y0=Math.min(0,...vals); if(y1===y0) y1=y0+1;
  const Y=v=>T+(y1-v)/(y1-y0)*(H-T-B); const bw=(W-L-R)/bars.length;
  let g=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="${C('--line')}"/>`;
  g+=`<text x="${L-4}" y="${Y(y1)+3}" text-anchor="end">${fmt(y1)}</text>`;
  if(y0<0) g+=`<text x="${L-4}" y="${Y(y0)+3}" text-anchor="end">${fmt(y0)}</text>`;
  bars.forEach((b,i)=>{ const x=L+i*bw+bw*.15, w=bw*.7;
    if(b.value!=null){ const y=Math.min(Y(0),Y(b.value)), h=Math.abs(Y(b.value)-Y(0));
      g+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,1)}" rx="2" fill="${b.color}"/>`; }
    if(bars.length<=14 || i%2===0) g+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${b.label}</text>`; });
  if(target) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(target)}" y2="${Y(target)}" stroke="${C('--warn')}" stroke-dasharray="5 5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

// ---------- Views ----------
const $ = s => document.querySelector(s);
const fmt1 = v => (Math.round(v*10)/10).toLocaleString();
const fmt0 = v => Math.round(v).toLocaleString();
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderDash(){
  const st=S.settings, cw=currentWeight(), lost=+st.startWeight-cw, togo=cw-(+st.goalWeight);
  const total=+st.startWeight-(+st.goalWeight), pct=Math.max(0,Math.min(100,lost/total*100));
  const rate=weeklyRate(), t=today(), ws=weightSeries();
  let proj='Log your weight for 2 weeks to see a projection.';
  if(rate && rate>0){ const days=togo/rate*7; const d=new Date(); d.setDate(d.getDate()+days);
    proj=`At ${fmt1(rate)} kg/week you reach ${st.goalWeight} kg around <b>${d.toLocaleDateString(undefined,{month:'short',year:'numeric'})}</b>.`; }
  else if(rate!==null) proj='Weight is flat or rising over the last 4 weeks. Check your logging and deficit.';
  const rateNote = rate==null? '' : rate>cw*0.01 ? '<span class="warn">Faster than 1%/week</span>' : rate>=cw*0.005 ? '<span class="good">On a healthy pace</span>' : '<span class="muted">Slower than 0.5%/week</span>';
  // last 14 days deficit
  const last14=[...Array(14)].map((_,i)=>addDays(t,i-13));
  const defs=last14.map(d=>({label:d.slice(8), value:deficit(d), color:(deficit(d)??0)>=0?C('--good'):C('--bad')}));
  const logged=defs.filter(b=>b.value!=null); const avgDef=logged.length? logged.reduce((a,b)=>a+b.value,0)/logged.length:null;
  const allDef=sortedDates().map(deficit).filter(v=>v!=null).reduce((a,b)=>a+b,0);
  // zone 2 minutes per week, last 8 weeks
  const mon=mondayOf(t); const weeks=[...Array(8)].map((_,i)=>addDays(mon,(i-7)*7));
  const z2=weeks.map(w=>({label:w.slice(8)+'/'+(+w.slice(5,7)), value:[...Array(7)].reduce((a,_,k)=>a+z2Minutes(addDays(w,k)),0), color:C('--accent')}));
  const firstD = ws.length? (ws[0].d<st.startDate?ws[0].d:st.startDate) : st.startDate;
  const lastD = ws.length && ws[ws.length-1].d>t ? ws[ws.length-1].d : t;
  const endD = addDays(lastD, Math.max(21, Math.round((dnum(lastD)-dnum(firstD))*0.25)));
  const pace = d => +st.startWeight - (+st.startWeight-(+st.goalWeight)) * (dnum(d)-dnum(st.startDate))/Math.max(1,dnum(st.targetDate)-dnum(st.startDate));
  const goalLine=[{d:firstD,y:pace(firstD)},{d:endD,y:pace(endD)}];
  const eatenToday=eaten(t), target=calorieTarget();
  $('#tab-dash').innerHTML=`
  <h1>Progress</h1>
  <div class="card">
    <div class="row" style="justify-content:space-between"><b>${fmt1(lost)} kg lost</b><span class="muted">${fmt1(Math.max(0,togo))} kg to go</span></div>
    <div class="bar" style="margin:8px 0"><div style="width:${pct}%"></div></div>
    <div class="muted" style="font-size:13px">${proj}</div>
  </div>
  <div class="grid">
    <div class="card stat"><div class="v">${fmt1(cw)} kg</div><div class="l">Current weight</div></div>
    <div class="card stat"><div class="v">${rate==null?'–':fmt1(rate)+' kg'}</div><div class="l">Per week (4-wk trend) ${rateNote}</div></div>
    <div class="card stat"><div class="v">${fmt0(eatenToday)} / ${fmt0(target)}</div><div class="l">Calories today</div></div>
    <div class="card stat"><div class="v ${deficit(t)==null?'':deficit(t)>=0?'good':'bad'}">${deficit(t)==null?'–':fmt0(deficit(t))}</div><div class="l">Deficit today</div></div>
    <div class="card stat"><div class="v">${avgDef==null?'–':fmt0(avgDef)}</div><div class="l">Avg daily deficit (14 days)</div></div>
    <div class="card stat"><div class="v">${fmt1(allDef/KCAL_PER_KG)} kg</div><div class="l">Fat loss from logged deficit</div></div>
    <div class="card stat"><div class="v">${[...Array(7)].filter((_,i)=>isDone(addDays(mon,i))).length} / ${S.plan.filter(p=>p.type!=='rest').length}</div><div class="l">Workouts this week · ${streak(workoutStatus)} day streak</div></div>
    <div class="card stat"><div class="v">${[...Array(7)].filter((_,i)=>fastStatus(addDays(mon,i))==='hit').length} / 7</div><div class="l">16:8 fasts this week · ${streak(fastStatus)} day streak</div></div>
  </div>
  <div class="card"><h2>Weight</h2>
    ${lineChart([
      {points:goalLine, color:C('--muted'), dash:true, width:1.5},
      {points:ws, color:C('--accent'), line:false, dots:true},
      {points:trend(ws), color:C('--accent'), width:2.5},
    ],{yFmt:v=>v.toFixed(0), xFrom:firstD, xTo:endD})}
    <div class="legend"><span><i style="background:${C('--accent')}"></i>7-day average</span><span><i style="background:${C('--muted')}"></i>Goal pace</span></div>
  </div>
  <div class="card"><h2>Daily deficit (14 days)</h2>
    ${barChart(defs,{target:750})}
    <div class="legend"><span><i style="background:${C('--good')}"></i>Deficit</span><span><i style="background:${C('--bad')}"></i>Surplus</span><span><i style="background:${C('--warn')}"></i>750 target</span></div>
  </div>
  <div class="card"><h2>Zone 2 minutes per week</h2>
    ${barChart(z2,{target:150})}
    <div class="legend"><span><i style="background:${C('--warn')}"></i>150 min goal</span></div>
  </div>`;
}

let logDate = today();
function renderLog(){ setTimeout(renderPhoto,0);
  const x=day(logDate), t=calorieTarget(), e=eaten(logDate), p=protein(logDate), def=deficit(logDate);

function num(id){ const v=$(id).value.trim().replace(',','.'); return v===''?'':+v; }
function saveBody(){ const x=day(logDate); x.weight=num('#w'); x.active=num('#act'); save(); toast('Saved'); renderLog(); }

  day(logDate).meals.push({name:n,kcal:k,protein:num('#mp')}); save(); renderLog(); }

  day(logDate).workouts.push({type:s.value,label:s.options[s.selectedIndex].text,minutes:m,kcal:num('#wk')});

// ---------- Photo calorie estimate (Claude API, called straight from the phone) ----------
const KEY_STORE='cuttracker.apikey';
function apiKey(){ try{ return localStorage.getItem(KEY_STORE)||''; }catch(e){ return ''; } }
let pending=null; // {img, note, result}
function photoPicked(file){
  if(!file) return;
  if(!apiKey()){ toast('Add your API key in Settings first'); return; }
  shrink(file).then(img=>{ pending={img, note:'', result:null}; renderPhoto(); });
}
function shrink(file){ return new Promise((ok,bad)=>{ const r=new FileReader(); r.onerror=bad; r.onload=()=>{ const im=new Image(); im.onerror=bad;
  im.onload=()=>{ const m=1024, k=Math.min(1,m/Math.max(im.width,im.height)); const c=document.createElement('canvas');
    c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    ok(c.toDataURL('image/jpeg',0.8)); }; im.src=r.result; }; r.readAsDataURL(file); }); }
function renderPhoto(){
  const b=$('#photoBox'); if(!b||!pending) return; const r=pending.result;
  b.innerHTML=`<img src="${pending.img}" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:8px">
  ${r? `<ul class="list">${r.items.map(i=>`<li><span>${esc(i.food)} <span class="muted">· ${esc(i.portion)}</span></span><span>${fmt0(i.kcal)}</span></li>`).join('')}</ul>

      <div><label>Protein g</label><input id="pp" inputmode="numeric" value="${r.protein}"></div></div>
    <div class="row" style="margin-top:10px"><button class="ghost" onclick="pending=null;renderLog()">Cancel</button><button onclick="addPhotoMeal()">Add meal</button></div>`
  : pending.busy? `<p class="muted" style="text-align:center">Estimating… (about 10–20 seconds)</p>`
  : `<label>Anything the photo can't show? (optional)</label><input id="pnote" placeholder="e.g. large portion, fried in oil, no rice" value="${esc(pending.note)}">
    <div class="row" style="margin-top:10px"><button class="ghost" onclick="pending=null;renderLog()">Cancel</button><button onclick="estimate()">Estimate calories</button></div>
    ${pending.error?`<p class="bad" style="font-size:13px">${esc(pending.error)}</p>`:''}`}`;
}
async function estimate(){
  pending.note=($('#pnote')||{}).value||''; pending.busy=true; pending.error=''; renderPhoto();
  const schema={type:'object',additionalProperties:false,required:['name','kcal','protein','items','note'],properties:{
    name:{type:'string'}, kcal:{type:'integer'}, protein:{type:'integer'}, note:{type:'string'},
    items:{type:'array',items:{type:'object',additionalProperties:false,required:['food','portion','kcal'],
      properties:{food:{type:'string'},portion:{type:'string'},kcal:{type:'integer'}}}}}};
  const prompt='Estimate the calories and protein in this meal photo for a food diary. List each food you can see with a portion size and calories. '+
    'Give a short meal name, the total calories (kcal), total protein in grams, and a one-sentence note on anything uncertain (hidden oil, sauces, portion size). '+
    'If it is a common Thai or Asian dish, use typical restaurant portions. Lean slightly high rather than low when unsure.'+
    (pending.note?` The person adds: "${pending.note}".`:'');
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
      'content-type':'application/json','x-api-key':apiKey(),'anthropic-version':'2023-06-01',
      'anthropic-beta':'server-side-fallback-2026-07-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-5-5', max_tokens:4000, fallbacks:'default',
        output_config:{effort:'low', format:{type:'json_schema', schema}},
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:pending.img.split(',')[1]}},
          {type:'text',text:prompt}]}]})});
    const data=await res.json();
    if(!res.ok) throw new Error(res.status===401?'API key was rejected. Check it in Settings.':(data.error&&data.error.message)||('Error '+res.status));
    if(data.stop_reason==='refusal') throw new Error('The photo could not be analysed. Try another photo or add the meal by hand.');
    const t=(data.content||[]).find(c=>c.type==='text'); if(!t) throw new Error('No estimate came back. Try again.');
    pending.result=JSON.parse(t.text);
  }catch(e){ pending.error=(e&&e.message)||'Something went wrong. Check your internet connection.'; }
  pending.busy=false; renderPhoto();
}
function addPhotoMeal(){ const k=num('#pk'); if(k===''){toast('Add calories');return;}

// Progression: +5 min on each jog every 2 weeks, an easier week every 4th week, caps 60 / 90 min
function weekNo(d){ return Math.max(1, Math.floor((dnum(mondayOf(d))-dnum(mondayOf(S.settings.startDate)))/7)+1); }
const isDeload = w => w%4===0;
function sessionFor(i, d){
  const p=S.plan[i], w=weekNo(d);
  if(p.type==='z2' && p.min){
    let m=p.min+5*Math.floor((w-1)/2); m=Math.min(m, p.long?90:60); if(isDeload(w)) m=Math.max(20,m-10);
    return {...p, detail:`${m} min easy${p.long?' (long run)':', able to talk in full sentences'}`};
  }
  if(p.type==='strength'){ const sets=w<=2?2:3;
    return {...p, detail:p.detail.replace(/3 sets of 8-12/, isDeload(w)?`${sets-1} sets of 8-12 (easy week)`:`${sets} sets of 8-12`)}; }
  return p;
}

  </div>
  <p class="muted" style="font-size:13px">The plan grows by itself: jogs get 5 minutes longer every 2 weeks (up to 60 min, or 90 for the long run), strength goes from 2 to 3 sets after week 2, and every 4th week is easier so your body can recover. In strength sessions, when you can do 12 reps on every set, go a little heavier. Editing a day fixes it at what you type.</p>`;

function hm(ms){ const m=Math.max(0,Math.floor(ms/6e4)); return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'; }

function endFast(){ const el=Date.now()-S.fastStart;

// ---------- Strava ----------
const SKEY='cuttracker.strava';
function stravaCfg(){ try{ return JSON.parse(localStorage.getItem(SKEY))||{}; }catch(e){ return {}; } }
function stravaSave(c){ try{ localStorage.setItem(SKEY,JSON.stringify(c)); }catch(e){} }
function stravaTok(){ return stravaCfg().refresh_token; }
const APP_URL = location.origin + location.pathname;
function stravaConnect(){
  const id=$('#sid').value.trim(), secret=$('#ssec').value.trim(); if(!id||!secret){ toast('Paste both Client ID and Secret'); return; }
  stravaSave({id,secret});
  location.href='https://www.strava.com/oauth/authorize?client_id='+encodeURIComponent(id)+'&response_type=code&approval_prompt=auto&scope=activity:read_all&redirect_uri='+encodeURIComponent(APP_URL);
}
function stravaDisconnect(){ const c=stravaCfg(); stravaSave({id:c.id,secret:c.secret}); renderSettings(); toast('Strava disconnected'); }
async function stravaToken(body){
  const c=stravaCfg();
  const r=await fetch('https://www.strava.com/oauth/token',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({client_id:c.id, client_secret:c.secret, ...body})});
  const j=await r.json(); if(!r.ok||!j.access_token) throw new Error((j.message||'Strava sign-in failed')+(j.errors?': '+JSON.stringify(j.errors):''));
  stravaSave({...c, access_token:j.access_token, refresh_token:j.refresh_token, expires_at:j.expires_at}); return j.access_token;
}
async function stravaAccess(){ const c=stravaCfg(); if(c.access_token && c.expires_at*1000>Date.now()+60000) return c.access_token;
  return stravaToken({grant_type:'refresh_token', refresh_token:c.refresh_token}); }
async function stravaSync(manual){
  if(!stravaTok()) return;
  try{
    const tok=await stravaAccess(); const c=stravaCfg();
    const after=c.last? c.last-3*86400 : Math.floor(Date.now()/1000)-120*86400; let page=1, added=0;
    while(page<=5){
      const r=await fetch(`https://www.strava.com/api/v3/athlete/activities?after=${after}&per_page=100&page=${page}`,{headers:{authorization:'Bearer '+tok}});
      if(!r.ok) throw new Error('Strava error '+r.status); const list=await r.json(); if(!list.length) break;
      for(const a of list){ if(!/Run/.test(a.sport_type||a.type)) continue;
        if(!S.runs[a.id]) added++;
        S.runs[a.id]={date:(a.start_date_local||'').slice(0,10), name:a.name, km:Math.round(a.distance/10)/100, secs:a.moving_time,
          hr:a.average_heartrate?Math.round(a.average_heartrate):null, elev:Math.round(a.total_elevation_gain||0)}; }
      if(list.length<100) break; page++;
    }
    stravaSave({...stravaCfg(), last:Math.floor(Date.now()/1000)}); save();
    if(manual||added) toast(added?`Synced ${added} new run${added>1?'s':''} from Strava`:'Strava is up to date');
    renderAll();
  }catch(e){ if(manual) toast(e.message||'Could not reach Strava'); }
}
async function stravaCallback(){
  const q=new URLSearchParams(location.search); if(!q.has('code')&&!q.has('error')) return false;
  history.replaceState(null,'',location.pathname);
  if(q.get('error')){ toast('Strava connection was cancelled'); return true; }
  try{ await stravaToken({grant_type:'authorization_code', code:q.get('code')}); toast('Strava connected ✓'); await stravaSync(true); }
  catch(e){ toast(e.message); }
  return true;
}
function pace(secs,km){ if(!km) return '–'; const p=secs/km; return Math.floor(p/60)+':'+String(Math.round(p%60)).padStart(2,'0'); }
function runCard(){
  const runs=Object.values(S.runs||{}).filter(r=>r.km>=1).sort((a,b)=>a.date<b.date?-1:1);
  if(!runs.length) return `<div class="card"><h2>Running progress</h2><p class="muted" style="margin:0">${stravaTok()?'No runs synced yet. Go for a jog!':'Connect Strava in Settings to see your jogging progress here.'}</p></div>`;
  const mon=mondayOf(today()); const weeks=[...Array(12)].map((_,i)=>addDays(mon,(i-11)*7));
  const wkm=weeks.map(w=>({label:w.slice(8)+'/'+(+w.slice(5,7)), value:runs.filter(r=>r.date>=w&&r.date<addDays(w,7)).reduce((a,r)=>a+r.km,0), color:C('--accent')}));
  const pts=runs.map(r=>({d:r.date, y:r.secs/r.km/60}));
  const avg=pts.map((p,i)=>{ const w=pts.slice(Math.max(0,i-4),i+1); return {d:p.d, y:w.reduce((a,q)=>a+q.y,0)/w.length}; });
  const first=runs.slice(0,4), last=runs.slice(-4); const pf=first.reduce((a,r)=>a+r.secs,0)/first.reduce((a,r)=>a+r.km,0), pl=last.reduce((a,r)=>a+r.secs,0)/last.reduce((a,r)=>a+r.km,0);
  const hf=first.filter(r=>r.hr), hl=last.filter(r=>r.hr);
  const hrF=hf.length?Math.round(hf.reduce((a,r)=>a+r.hr,0)/hf.length):null, hrL=hl.length?Math.round(hl.reduce((a,r)=>a+r.hr,0)/hl.length):null;
  const diff=pf-pl; const total=runs.reduce((a,r)=>a+r.km,0), longest=Math.max(...runs.map(r=>r.km));
  const mmss=v=>Math.floor(v)+':'+String(Math.round((v%1)*60)).padStart(2,'0');
  return `<div class="card"><h2>Running progress</h2>
    <div class="grid" style="margin-bottom:8px">
      <div class="stat"><div class="v">${fmt1(total)} km</div><div class="l">${runs.length} runs synced</div></div>
      <div class="stat"><div class="v">${fmt1(longest)} km</div><div class="l">Longest run</div></div>
    </div>
    ${runs.length>=8?`<p style="font-size:14px;margin:0 0 8px">Last 4 runs: <b>${pace(pl,1)}/km</b>${hrL?` at ${hrL} bpm`:''}, vs first 4: ${pace(pf,1)}/km${hrF?` at ${hrF} bpm`:''}.
      ${diff>5?`<span class="good">${pace(diff,1)} faster per km.</span>`:diff<-5?'<span class="muted">Slower so far, which is normal early on or in heat.</span>':'<span class="muted">About the same so far.</span>'}</p>`:''}
    <h2 style="margin-top:8px">Km per week</h2>${barChart(wkm,{fmt:v=>v.toFixed(0)})}
    <h2 style="margin-top:12px">Pace per run (min/km, lower is faster)</h2>
    ${lineChart([{points:pts,color:C('--muted'),line:false,dots:true},{points:avg,color:C('--accent'),width:2.5}],{yFmt:mmss})}
    <p class="muted" style="font-size:12px;margin:6px 0 0">In zone 2, getting faster at the same heart rate is the sign your fitness is improving.</p>
    <ul class="list">${runs.slice(-5).reverse().map(r=>`<li><span>${r.date.slice(5).replace('-','/')} · ${fmt1(r.km)} km</span><span class="muted">${pace(r.secs,r.km)}/km${r.hr?` · ${r.hr} bpm`:''}</span></li>`).join('')}</ul>
  </div>`;
}

function importFromUrl(){
  const q=new URLSearchParams(location.search); if(!q.has('weight')&&!q.has('active')) return;
  const d=/^\d{4}-\d{2}-\d{2}$/.test(q.get('date')||'')?q.get('date'):today(); const x=day(d); const got=[];
  const num=k=>parseFloat(String(q.get(k)||'').replace(',','.').replace(/[^0-9.]/g,''));
  const w=num('weight'); if(w>20&&w<400){ x.weight=Math.round(w*10)/10; got.push('weight'); }
  const a=num('active'); if(a>=0&&a<10000){ x.active=Math.round(a); got.push('active calories'); }
  save(); history.replaceState(null,'',location.pathname); if(got.length) toast('Imported '+got.join(' and ')+' from Health');
}

// ---------- Shell ----------
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.opacity=1; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.opacity=0,2200); }
function renderAll(){ renderDash(); renderLog(); renderPlan(); renderFast(); renderSettings(); }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('main > section').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+b.dataset.tab));
  ({dash:renderDash,log:renderLog,plan:renderPlan,fast:renderFast,settings:renderSettings})[b.dataset.tab](); window.scrollTo(0,0);
});
importFromUrl(); renderAll();
stravaCallback().then(handled=>{ if(!handled) stravaSync(false); });
</script>
</body>
