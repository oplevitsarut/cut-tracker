<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cut Tracker">
<title>Cut Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
/* Style: editorial greeting (taste-skill). One phone column, 20px side margins, one 16px gap.
   Panels are a tonal step off the page, no borders, no shadows. The one hue (deep teal) is for data:
   the weight trend, today's eaten bar, the kilos lost, done marks. Everything else is ink and grey. */
:root{
  color-scheme: light;
  --ground:#ffffff; --surface:#f6f6f3; --raised:#ffffff; --active:#e9e9e5;
  --border:#e6e6e2; --rule:#e6e6e2; --control:#d4d4cf; --grid:#e4e4df;
  --text:#1f201d; --muted:#61615e; --faint:#6b6b68;
  --primary:#1f201d; --on-primary:#ffffff;
  --accent:#1b6e66; --accent-tint:#dcebe8;
  --negative:#b42318; --neg-tint:#fdecea; --neg-ink:#7a1d14;
  --warn-bg:#fffbeb; --warn-line:#fde68a; --warn-ink:#92400e;
  --serif:"Instrument Serif", Georgia, serif;
  --sans:"Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --ground:#000000; --surface:#121212; --raised:#1b1b1b; --active:#262626;
  --border:#262626; --rule:#242424; --control:#454545; --grid:#2b2b2b;
  --text:#f2f2f0; --muted:#b4b4b4; --faint:#949494;
  --primary:#f2f2f0; --on-primary:#000000;
  --accent:#4fb3a6; --accent-tint:#13302c;
  --negative:#e5566f; --neg-tint:#2c1a20; --neg-ink:#f08a9c;
  --warn-bg:#2a2112; --warn-line:#5c4514; --warn-ink:#f0c46a; } }
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#000000; --surface:#121212; --raised:#1b1b1b; --active:#262626;
  --border:#262626; --rule:#242424; --control:#454545; --grid:#2b2b2b;
  --text:#f2f2f0; --muted:#b4b4b4; --faint:#949494;
  --primary:#f2f2f0; --on-primary:#000000;
  --accent:#4fb3a6; --accent-tint:#13302c;
  --negative:#e5566f; --neg-tint:#2c1a20; --neg-ink:#f08a9c;
  --warn-bg:#2a2112; --warn-line:#5c4514; --warn-ink:#f0c46a; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--text);
  font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 20px calc(100px + env(safe-area-inset-bottom))}
section > * + *{margin-top:16px}
.hidden{display:none !important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .neg{color:var(--negative)} .pos{color:var(--accent)}

/* Brand row and titles */
.brand{display:flex;align-items:center;gap:8px;height:32px;font-size:14px;font-weight:600}
.brand svg{width:22px;height:22px}
.brand .scope{margin-left:auto;font-weight:400;color:var(--muted);font-size:13px}
h1{margin:20px 0 0;font:500 24px/1.2 var(--sans);letter-spacing:-.01em}
h1.greet{font:400 28px/1.1 var(--serif);letter-spacing:-.01em;margin-top:22px}
.lede{margin:6px 0 0;font-size:16px;color:var(--muted);max-width:34em}
.lede b{color:var(--text);font-weight:500}

/* Panels */
.panel{background:var(--surface);border-radius:22px;padding:20px}
.panel.inner{background:var(--raised);border-radius:14px;padding:14px 12px 10px;margin-top:14px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:22px}
h2{margin:0;font:600 15px/1.3 var(--sans)}
.meta{font-size:13px;color:var(--muted);text-align:right}
.lead{display:flex;align-items:baseline;gap:8px;margin-top:12px;flex-wrap:wrap}
.lead .fig{font-size:36px;line-height:1;font-weight:400;letter-spacing:-.02em}
.lead .unit{font-size:15px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:12px 0 0}
.note b{color:var(--text);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:16px;height:10px;flex:none}

/* Plan track: how much of the day's budget is used */
.track{position:relative;height:10px;border-radius:999px;background:var(--active);margin-top:14px;overflow:hidden}
.track > i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.track > i.over{background:var(--negative)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}

/* Divided strip of figures */
.strip{display:grid;grid-template-columns:repeat(var(--n,4),1fr);margin-top:16px;border-top:1px solid var(--rule)}
.strip > div{padding:12px 10px 0;border-left:1px solid var(--rule);min-width:0}
.strip > div:first-child{border-left:0;padding-left:0}
.strip .l{font-size:12px;color:var(--muted);white-space:nowrap}
.strip .v{font-size:20px;line-height:1.2;margin-top:2px;white-space:nowrap}
.strip .v small{font-size:13px;color:var(--muted)}
@media (max-width:420px){
  .strip.four{grid-template-columns:1fr 1fr;row-gap:0}
  .strip.four > div:nth-child(3){border-left:0;padding-left:0}
  .strip.four > div:nth-child(n+3){margin-top:12px;border-top:1px solid var(--rule)}
}

/* Rows: today's checklist, meals, fasts, runs */
.rows{list-style:none;margin:12px 0 0;padding:0}
.rows li{display:flex;align-items:center;gap:12px;min-height:56px;padding:9px 0;border-top:1px solid var(--rule)}
.rows li:first-child{border-top:0}
.rows .t{font-weight:500}
.rows .s{font-size:13px;color:var(--muted)}
.rows .grow{flex:1;min-width:0}
.rows .fig{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.rows .fig small{font-size:12px;color:var(--muted);margin-left:3px}
.rows .s.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.more{margin-top:12px;font-size:13px;color:var(--muted)}
details.more summary{cursor:pointer;color:var(--text);min-height:32px;display:flex;align-items:center}
details.more p{margin:4px 0 0}
.rows li.on{background:var(--active);border-radius:12px;margin:0 -10px;padding-left:10px;padding-right:10px;border-top-color:transparent}
.rows li.on + li{border-top-color:transparent}
.dot{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--control);display:flex;align-items:center;justify-content:center}
.dot.ok{background:var(--accent);border-color:var(--accent);color:var(--ground)}
.dot.rest{border-style:dashed}
.dot svg{width:14px;height:14px}
button.dot{padding:0;min-height:0;background:none;cursor:pointer}
button.dot.ok{background:var(--accent)}
.dayname{font-size:12px;color:var(--muted)}

/* Controls */
input,select,button,textarea{font:inherit;color:inherit}
label{display:block;font-size:14px;font-weight:500;margin:16px 0 8px}
input,select{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--raised);outline:none;font-size:16px}
input::placeholder{color:var(--faint)}
input:focus,select:focus,.datebox:focus-within{border-color:var(--text)}
.datebox{position:relative;min-height:44px;padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--raised);
  display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:16px;overflow:hidden;min-width:0}
.datebox span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebox::after{content:'';width:7px;height:7px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translateY(-2px);flex:none}
.datebox input{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;border:0;padding:0;margin:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fields > div{min-width:0}
.inline{display:flex;gap:8px;align-items:center;margin-top:8px}
.inline > input{flex:1;min-width:0}
button{min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid var(--control);background:var(--raised);font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:active{transform:scale(.98)}
button.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
button.text{border:0;background:none;padding:10px 4px;min-height:40px;color:var(--text);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--control)}
button.danger{color:var(--negative)}
button.wide{width:100%}
button.round{width:44px;padding:0;flex:none}
button.x{border:0;background:none;min-height:40px;width:40px;padding:0;color:var(--muted);flex:none}
button svg{width:18px;height:18px;flex:none}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions > button{flex:1}
.datenav{display:flex;gap:8px;align-items:center;margin-top:16px}
.datenav .datebox{flex:1}

/* Status pills and notices */
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;flex:none;
  background:var(--active);color:var(--text)}
.pill.ok{background:var(--accent-tint);color:var(--accent)}
.pill.bad{background:var(--neg-tint);color:var(--neg-ink)}
.notice{margin-top:12px;padding:10px 12px;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;font-size:13px}

/* Calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.calhead b{font-weight:500}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:14px;margin-top:8px}
.cal .h{color:var(--muted);font-size:12px;padding:4px 0}
.cal .c{aspect-ratio:1;max-height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin:0 auto;width:100%;max-width:44px}
.cal .hit{background:var(--accent);color:var(--ground)}
.cal .c svg{width:62%;height:62%;max-width:24px;max-height:24px}
.legend .ak{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--ground);align-items:center;justify-content:center}
.legend .ak svg{width:14px;height:14px}
.cal .miss{background:var(--neg-tint);color:var(--neg-ink)}
.cal .rest{color:var(--muted)}
.cal .now{box-shadow:inset 0 0 0 1.5px var(--text)}
.cal .fut{color:var(--muted)}
.swatch{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}

/* Fasting */
.timer{font-size:40px;line-height:1;letter-spacing:-.02em;margin-top:12px}

/* Charts */
svg.chart{display:block;width:100%;height:auto;overflow:visible;margin-top:12px}
svg.chart text{fill:var(--muted);font-size:12px;font-family:var(--sans);font-variant-numeric:tabular-nums}
svg.chart text.lab{fill:var(--text);font-weight:500}
.empty{margin-top:12px;border:1px dashed var(--control);border-radius:12px;padding:12px;font-size:14px;color:var(--muted)}

/* Settings: title and description, then the panel */
.set{padding-top:20px;margin-top:20px;border-top:1px solid var(--rule)}
.set > h2{font-size:16px;font-weight:500}
.set > p{margin:4px 0 12px;color:var(--muted);font-size:14px}
.set .panel > label:first-child,.set .panel > .fields:first-child label{margin-top:0}

/* Bottom bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--ground);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:640px;margin:0 auto}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--muted);min-height:58px;padding:8px 2px 6px;font-size:11px;font-weight:500;
  flex-direction:column;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--text)}
nav button.on svg{stroke-width:2}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--primary);color:var(--on-primary);
  padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.toast.show{opacity:1}
.tip{position:fixed;z-index:8;background:var(--raised);color:var(--text);border:1px solid var(--border);font-size:13px;padding:6px 10px;border-radius:8px;
  pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.10)}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<main>
  <section id="tab-dash"></section>
  <section id="tab-log" class="hidden"></section>
  <section id="tab-plan" class="hidden"></section>
  <section id="tab-fast" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
</main>
<nav aria-label="Screens"><div class="in">
  <button data-tab="dash" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button data-tab="log"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg>Log</button>
  <button data-tab="plan"><svg class="ic" viewBox="0 0 24 24"><path d="M7 7v10M17 7v10M4 9.5v5M20 9.5v5M7 12h10"/></svg>Workout</button>
  <button data-tab="fast"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 2M10 3h4"/></svg>Fasting</button>
  <button data-tab="settings"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<div class="tip" id="tip"></div>
<script>

// ---------- Storage ----------
const KEY = 'cuttracker.v1';
const DEFAULT_PLAN = [
  {name:'Zone 2 jog', detail:'35 min easy, able to talk in full sentences', type:'z2', min:35},
  {name:'Strength A', detail:'Squat, push-up/bench, row, plank. 3 sets of 8-12', type:'strength'},
  {name:'Zone 2 jog', detail:'40 min easy', type:'z2', min:40},
  {name:'Strength B', detail:'Deadlift/hinge, overhead press, pulldown, lunges. 3 sets of 8-12', type:'strength'},
  {name:'Rest or walk', detail:'Optional 30 min walk', type:'rest'},
  {name:'Long zone 2 jog', detail:'50-60 min easy', type:'z2', min:50, long:true},
  {name:'Rest', detail:'Recovery day', type:'rest'},
]; // Monday first
const today = () => iso(new Date());
function iso(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function addDays(s,n){ const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function dnum(s){ return new Date(s+'T12:00:00').getTime()/864e5; }
function load(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s) s={};
  s.settings = Object.assign({sex:'male', age:25, z2lo:116, z2hi:145, paceGoal:'10:00', paceGoalDate:'2026-12-31', height:177, startWeight:113.5, goalWeight:83.5,
    name:'', startDate:'2026-11-03', targetDate:'2027-05-03', activity:1.2, calorieTarget:'', proteinTarget:''}, s.settings||{});
  s.days = s.days||{}; s.plan = s.plan||DEFAULT_PLAN.map(p=>({...p})); s.plan.forEach((p,i)=>{ const d=DEFAULT_PLAN[i]; if(p.min===undefined && d && d.min && p.name===d.name && p.detail===d.detail){ p.min=d.min; if(d.long) p.long=true; } });
  s.runs = s.runs||{};
  s.done = s.done||{}; s.fasts = s.fasts||[]; if(s.fastStart===undefined) s.fastStart=null;
  if(!s.settings.age) s.settings.age=25;
  return s;
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Could not save on this device'); } }
function day(d){ return S.days[d] || (S.days[d]={meals:[],workouts:[]}); }

// ---------- Maths ----------
const KCAL_PER_KG = 7700;
const age = () => +S.settings.age || 25;
function bmr(w){ const st=S.settings; return 10*w + 6.25*(+st.height) - 5*age() + (st.sex==='male'?5:-161); }
function tdee(w){ return bmr(w) * (+S.settings.activity||1.2); }
function sortedDates(){ return Object.keys(S.days).sort(); }
function weightOn(d){ // latest weight on or before d
  let w=null; for(const k of sortedDates()){ if(k>d) break; if(S.days[k].weight) w=+S.days[k].weight; }
  return w ?? +S.settings.startWeight;
}
function currentWeight(){ return weightOn(today()); }
function minKcal(){ return S.settings.sex==='male'?1500:1200; }
function calorieTarget(){
  if(+S.settings.calorieTarget) return +S.settings.calorieTarget;
  return Math.max(minKcal(), Math.round((tdee(currentWeight())-750)/50)*50);
}
function proteinTarget(){ return +S.settings.proteinTarget || Math.round(1.6*(+S.settings.goalWeight)/5)*5; }
function eaten(d){ const x=S.days[d]; return x? x.meals.reduce((a,m)=>a+(+m.kcal||0),0):0; }
function protein(d){ const x=S.days[d]; return x? x.meals.reduce((a,m)=>a+(+m.protein||0),0):0; }
function exerciseKcal(d){ // Health active energy wins, otherwise logged workouts
  const x=S.days[d]; if(!x) return 0;
  if(x.active!=null && x.active!=='') return +x.active;
  return x.workouts.reduce((a,w)=>a+(+w.kcal||0),0);
}
function burned(d){ return Math.round(tdee(weightOn(d)) + exerciseKcal(d)); }
function deficit(d){ const x=S.days[d]; if(!x||!x.meals.length) return null; return burned(d)-eaten(d); }
// Pace goal, in minutes per km ("10:00" -> 10)
function paceGoal(){ const m=String(S.settings.paceGoal||'10:00').trim().match(/^(\d+)(?:[:.](\d{1,2}))?$/); return m? +m[1]+(+(m[2]||0))/60 : 10; }
// Straight-line trend of zone 2 run pace over the last 6 weeks: minutes per km change per day
function paceTrend(runs){ const t=dnum(today()); const r=runs.filter(x=>dnum(x.date)>t-42); if(r.length<4) return null;
  const xs=r.map(x=>dnum(x.date)), ys=r.map(x=>x.secs/x.km/60), mx=xs.reduce((a,b)=>a+b)/xs.length, my=ys.reduce((a,b)=>a+b)/ys.length;
  const sxx=xs.reduce((a,x)=>a+(x-mx)**2,0); if(!sxx) return null; const slope=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/sxx; return {slope, at:d=>my+slope*(dnum(d)-mx)}; }
const KINDS={run:'Run',treadmill:'Treadmill walk',walk:'Walk',badminton:'Badminton',tennis:'Tennis',strength:'Strength',other:'Other'};
function kindOf(a){ const t=a.sport_type||a.type||'';
  if(t==='VirtualRun'||(a.trainer&&/Run|Walk|Hike/.test(t))) return 'treadmill';
  if(/Run/.test(t)) return 'run'; if(/Walk|Hike/.test(t)) return 'walk';
  if(/Badminton/.test(t)) return 'badminton'; if(/Tennis/.test(t)) return 'tennis';
  if(/WeightTraining|Crossfit|Workout/.test(t)) return 'strength'; return 'other'; }
const actKind = r => r.kind||'run';
function actsOn(d){ return Object.values(S.runs||{}).filter(r=>r.date===d); }
function runsOn(d){ return actsOn(d).filter(r=>actKind(r)==='run'); }
function zone2Range(){ return [+S.settings.z2lo||116, +S.settings.z2hi||145]; }
function inZone2(r){ const [lo,hi]=zone2Range(); return !r.hr || (r.hr>=lo && r.hr<=hi); }
// Zone 2 minutes: outdoor runs and treadmill sessions whose average heart rate is in range, or zone 2 jogs logged by hand
function z2Minutes(d){ const x=S.days[d]; const logged=x? x.workouts.filter(w=>w.type==='z2').reduce((a,w)=>a+(+w.minutes||0),0):0;
  const strava=actsOn(d).filter(r=>['run','treadmill'].includes(actKind(r)) && inZone2(r)).reduce((a,r)=>a+r.secs/60,0); return Math.round(Math.max(logged,strava)); }
function weightSeries(){ return sortedDates().filter(d=>S.days[d].weight).map(d=>({d, y:+S.days[d].weight})); }
function trend(series){ // 7-day moving average by date
  return series.map(p=>{ const w=series.filter(q=>dnum(q.d)<=dnum(p.d) && dnum(q.d)>dnum(p.d)-7);
    return {d:p.d, y:w.reduce((a,q)=>a+q.y,0)/w.length}; });
}
function weeklyRate(){ // kg per week from trend over last 28 days
  const t=trend(weightSeries()); if(t.length<2) return null;
  const last=t[t.length-1]; const first=t.find(p=>dnum(p.d)>=dnum(last.d)-28)||t[0];

function paceCard(){
  const runs=allRuns(); if(!runs.length) return '';
  const zr=runs.filter(inZone2).length>=3? runs.filter(inZone2) : runs;
  const pts=zr.map(r=>({d:r.date, y:r.secs/r.km/60}));
  const avg=pts.map((p,i)=>{ const w=pts.slice(Math.max(0,i-4),i+1); return {d:p.d, y:w.reduce((a,q)=>a+q.y,0)/w.length}; });
  const goal=paceGoal(), gd=S.settings.paceGoalDate||'2026-12-31', start=avg[0].y, now=avg[avg.length-1].y, gap=now-goal, tr=paceTrend(zr);
  const weeksLeft=Math.max(0,(dnum(gd)-dnum(today()))/7), need=weeksLeft>0&&gap>0? Math.ceil(gap*60/weeksLeft) : null;
  const prog= start>goal? Math.max(0,Math.min(100,(start-now)/(start-goal)*100)) : 100;
  let line;
  if(gap<=0) line='Goal reached. Set a new one in Settings.';
  else { let eta='Not getting faster yet, which is normal in the first 4 to 6 weeks.';
    if(tr && tr.slope<0){ const d=addDays(today(),Math.max(0,Math.round((goal-tr.at(today()))/tr.slope))); eta=`On your current trend: <b>${dlabel(d)}</b>${d>gd?', a bit late':''}.`; }
    line=`Needs about <b>${need??'—'} s/km faster a week</b>. ${eta}`; }
  const lastD=pts[pts.length-1].d, end=gd>lastD?gd:lastD;
  return `<div class="panel"><div class="ph"><h2>Pace goal</h2><span class="meta">by ${dlabel(gd)}</span></div>

}

function saveBody(){ const x=day(logDate); x.weight=num('#w'); x.active=num('#act'); const sl=parseSleep($('#slp').value); x.sleep=sl>0&&sl<16?Math.round(sl*100)/100:''; save(); toast('Saved'); renderLog(); }

// ---------- Photo calorie estimate (Claude API, called straight from the phone) ----------
const KEY_STORE='cuttracker.apikey';
function apiKey(){ try{ return localStorage.getItem(KEY_STORE)||''; }catch(e){ return ''; } }
let pending=null; // {img, note, result}
function photoPicked(file){
  if(!file) return;
  if(!apiKey()){ toast('Add your API key in Settings first'); return; }
  shrink(file).then(img=>{ pending={img, note:'', result:null}; renderPhoto(); });
}
function shrink(file){ return new Promise((ok,bad)=>{ const r=new FileReader(); r.onerror=bad; r.onload=()=>{ const im=new Image(); im.onerror=bad;
  im.onload=()=>{ const m=1024, k=Math.min(1,m/Math.max(im.width,im.height)); const c=document.createElement('canvas');
    c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    ok(c.toDataURL('image/jpeg',0.8)); }; im.src=r.result; }; r.readAsDataURL(file); }); }
async function estimate(){
  pending.note=($('#pnote')||{}).value||''; pending.busy=true; pending.error=''; renderPhoto();
  const schema={type:'object',additionalProperties:false,required:['name','kcal','protein','items','note'],properties:{
    name:{type:'string'}, kcal:{type:'integer'}, protein:{type:'integer'}, note:{type:'string'},
    items:{type:'array',items:{type:'object',additionalProperties:false,required:['food','portion','kcal'],
      properties:{food:{type:'string'},portion:{type:'string'},kcal:{type:'integer'}}}}}};
  const prompt='Estimate the calories and protein in this meal photo for a food diary. List each food you can see with a portion size and calories. '+
    'Give a short meal name, the total calories (kcal), total protein in grams, and a one-sentence note on anything uncertain (hidden oil, sauces, portion size). '+
    'If it is a common Thai or Asian dish, use typical restaurant portions. Lean slightly high rather than low when unsure.'+
    (pending.note?` The person adds: "${pending.note}".`:'');
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
      'content-type':'application/json','x-api-key':apiKey(),'anthropic-version':'2023-06-01',
      'anthropic-beta':'server-side-fallback-2026-07-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-5-5', max_tokens:4000, fallbacks:'default',
        output_config:{effort:'low', format:{type:'json_schema', schema}},
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:pending.img.split(',')[1]}},
          {type:'text',text:prompt}]}]})});
    const data=await res.json();
    if(!res.ok) throw new Error(res.status===401?'API key was rejected. Check it in Settings.':(data.error&&data.error.message)||('Error '+res.status));
    if(data.stop_reason==='refusal') throw new Error('The photo could not be analysed. Try another photo or add the meal by hand.');
    const t=(data.content||[]).find(c=>c.type==='text'); if(!t) throw new Error('No estimate came back. Try again.');
    pending.result=JSON.parse(t.text);
  }catch(e){ pending.error=(e&&e.message)||'Something went wrong. Check your internet connection.'; }
  pending.busy=false; renderPhoto();
}
function addPhotoMeal(){ const k=num('#pk'); if(k===''){toast('Add calories');return;}
  day(logDate).meals.push({name:$('#pn').value.trim()||'Meal',kcal:k,protein:num('#pp'),photo:true}); pending=null; save(); toast('Meal added'); renderLog(); }
function delItem(k,i){ day(logDate)[k].splice(i,1); save(); renderLog(); }

// Progression: +5 min on each jog every 2 weeks, an easier week every 4th week, caps 60 / 90 min
function weekNo(d){ return Math.max(1, Math.floor((dnum(mondayOf(d))-dnum(mondayOf(S.settings.startDate)))/7)+1); }
const isDeload = w => w%4===0;
function sessionFor(i, d){
  const p=S.plan[i], w=weekNo(d);
  if(p.type==='z2' && p.min){
    let m=p.min+5*Math.floor((w-1)/2); m=Math.min(m, p.long?90:60); if(isDeload(w)) m=Math.max(20,m-10);
    return {...p, detail:`${m} min easy${p.long?' (long run)':', able to talk in full sentences'}`};
  }
  if(p.type==='strength'){ const sets=w<=2?2:3;
    return {...p, detail:p.detail.replace(/3 sets of 8-12/, isDeload(w)?`${sets-1} sets of 8-12 (easy week)`:`${sets} sets of 8-12`)}; }
  return p;
}
function toggleDone(){ const d=today(); S.done[d]=!isDone(d); save(); renderPlan(); }
function editDay(i){ const p=S.plan[i];
  const n=prompt('Workout name',p.name); if(n===null) return;
  const d=prompt('Details',p.detail); if(d===null) return;
  p.name=n; p.detail=d; delete p.min; delete p.long; p.type=/rest/i.test(n)?'rest':/zone|jog|run/i.test(n)?'z2':'strength'; save(); renderPlan(); }

function hm(ms){ const m=Math.max(0,Math.floor(ms/6e4)); return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'; }
const dtl = ts => { const d=new Date(ts-new Date(ts).getTimezoneOffset()*6e4); return d.toISOString().slice(0,16); };
function fmtField(v,type){ if(!v) return 'Pick a date'; if(type==='date') return dlabel(v)+' '+v.slice(0,4);
  const d=new Date(v); return d.toLocaleDateString(undefined,{weekday:'short'})+' '+d.getDate()+' '+MON[d.getMonth()]+', '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function dateField(type,value,attrs=''){ return `<div class="datebox"><span>${fmtField(value,type)}</span><input type="${type}" value="${value}" ${attrs} oninput="this.previousElementSibling.textContent=fmtField(this.value,'${type}')"></div>`; }
const fromDtl = v => v? new Date(v).getTime() : NaN;
let fastForm=null; // 'start' | 'end' | 'past'
function startFast(){ S.fastStart=Date.now(); fastForm=null; save(); renderFast(); }
function setFastStart(){ const t=fromDtl($('#fs').value); if(!(t>0)||t>Date.now()){ toast('Pick a time in the past'); return; }
  S.fastStart=t; fastForm=null; save(); renderFast(); toast('Start time set to '+new Date(t).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})); }
function finishFast(end){ const el=end-S.fastStart;
  if(el<=0){ toast('Finish time must be after the start'); return; }
  if(el<36e5*FAST_H && !confirm('Only '+hm(el)+'. Save it anyway?')) return;
  S.fasts.push({start:S.fastStart,end}); S.fastStart=null; fastForm=null; save(); renderFast(); toast(el>=FAST_H*36e5?'Fast complete':'Fast saved'); }
function endFast(){ finishFast(Date.now()); }
function endFastAt(){ const t=fromDtl($('#fe').value); if(!(t>0)||t>Date.now()){ toast('Pick a time in the past'); return; } finishFast(t); }
function addPastFast(){ const a=fromDtl($('#ps').value), b=fromDtl($('#pe').value);
  if(!(a>0&&b>a)){ toast('Finish must be after start'); return; } if(b>Date.now()){ toast('Finish time is in the future'); return; }
  S.fasts.push({start:a,end:b}); fastForm=null; save(); renderFast(); toast('Fast added'); }
function delFast(i){ if(!confirm('Delete this fast?')) return; S.fasts.splice(i,1); save(); renderFast(); }
setInterval(()=>{ if(S.fastStart!=null && !fastForm && !$('#tab-fast').classList.contains('hidden')){ const t=$('#ftimer'); if(t) t.textContent=hm(Date.now()-S.fastStart);
  const el=Date.now()-S.fastStart; if(el>=FAST_H*36e5 && $('#fnote') && !/reached/.test($('#fnote').textContent)) renderFast(); } }, 15000);
function saveSettings(){ for(const k of Object.keys(S.settings)){ const el=$('#s-'+k); if(el) S.settings[k]=el.value; } save(); toast('Settings saved'); renderAll(); }
function exportData(){ const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=`cut-tracker-${today()}.json`; a.click(); }
function importData(file){ if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result);
  if(!d.days||!d.settings) throw 0; if(!confirm('Replace all data on this phone with this backup?')) return;
  localStorage.setItem(KEY,JSON.stringify(d)); S=load(); renderAll(); toast('Backup restored'); }catch(e){ toast('That file is not a backup'); } }; r.readAsText(file); }

// ---------- Import from iPhone Shortcut via URL: ?date=YYYY-MM-DD&weight=113.2&active=540 ----------
// ---------- Strava ----------
const SKEY='cuttracker.strava';
function stravaCfg(){ try{ return JSON.parse(localStorage.getItem(SKEY))||{}; }catch(e){ return {}; } }
function stravaSave(c){ try{ localStorage.setItem(SKEY,JSON.stringify(c)); }catch(e){} }
function stravaTok(){ return stravaCfg().refresh_token; }
const APP_URL = location.origin + location.pathname;
function stravaConnect(){
  const id=$('#sid').value.trim(), secret=$('#ssec').value.trim(); if(!id||!secret){ toast('Paste both Client ID and Secret'); return; }
  stravaSave({id,secret});
  location.href='https://www.strava.com/oauth/authorize?client_id='+encodeURIComponent(id)+'&response_type=code&approval_prompt=auto&scope=activity:read_all&redirect_uri='+encodeURIComponent(APP_URL);
}
function stravaDisconnect(){ const c=stravaCfg(); stravaSave({id:c.id,secret:c.secret}); renderSettings(); toast('Strava disconnected'); }
async function stravaToken(body){
  const c=stravaCfg();
  const r=await fetch('https://www.strava.com/oauth/token',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({client_id:c.id, client_secret:c.secret, ...body})});
  const j=await r.json(); if(!r.ok||!j.access_token) throw new Error((j.message||'Strava sign-in failed')+(j.errors?': '+JSON.stringify(j.errors):''));
  stravaSave({...c, access_token:j.access_token, refresh_token:j.refresh_token, expires_at:j.expires_at}); return j.access_token;
}
async function stravaAccess(){ const c=stravaCfg(); if(c.access_token && c.expires_at*1000>Date.now()+60000) return c.access_token;
  return stravaToken({grant_type:'refresh_token', refresh_token:c.refresh_token}); }
async function stravaSync(manual){
  if(!stravaTok()) return;
  try{
    const tok=await stravaAccess(); const c=stravaCfg();
    const after=c.last&&c.v2? c.last-3*86400 : Math.floor(Date.now()/1000)-120*86400; let page=1, added=0;
    while(page<=5){
      const r=await fetch(`https://www.strava.com/api/v3/athlete/activities?after=${after}&per_page=100&page=${page}`,{headers:{authorization:'Bearer '+tok}});
      if(!r.ok) throw new Error('Strava error '+r.status); const list=await r.json(); if(!list.length) break;
      for(const a of list){
        if(!S.runs[a.id]) added++;
        S.runs[a.id]={date:(a.start_date_local||'').slice(0,10), name:a.name, kind:kindOf(a), km:Math.round(a.distance/10)/100, secs:a.moving_time,
          hr:a.average_heartrate?Math.round(a.average_heartrate):null, elev:Math.round(a.total_elevation_gain||0)}; }
      if(list.length<100) break; page++;
    }
    stravaSave({...stravaCfg(), last:Math.floor(Date.now()/1000), v2:1}); save();
    if(manual||added) toast(added?`Synced ${added} new activit${added>1?'ies':'y'} from Strava`:'Strava is up to date');
    renderAll();
  }catch(e){ if(manual) toast(e.message||'Could not reach Strava'); }
}
async function stravaCallback(){
  const q=new URLSearchParams(location.search); if(!q.has('code')&&!q.has('error')) return false;
  history.replaceState(null,'',location.pathname);
  if(q.get('error')){ toast('Strava connection was cancelled'); return true; }
  try{ await stravaToken({grant_type:'authorization_code', code:q.get('code')}); toast('Strava connected'); await stravaSync(true); }
  catch(e){ toast(e.message); }
  return true;
}
function pace(secs,km){ if(!km) return '–'; const p=secs/km; return Math.floor(p/60)+':'+String(Math.round(p%60)).padStart(2,'0'); }
// Sleep from the Shortcut or typed in: "7.5", "7:30", "450" (minutes), "27000" (seconds), "7 hr 30 min", Thai "7 ชม. 30 นาที"
function parseSleep(v){ v=String(v??'').trim().toLowerCase().replace(/ชั่วโมง|ชม\.?/g,'h').replace(/นาที/g,'m').replace(',','.'); if(!v) return NaN;
  const c=v.match(/^(\d+):(\d{1,2})$/); if(c) return +c[1]+c[2]/60;
  const hr=v.match(/([\d.]+)\s*h/), mn=v.match(/([\d.]+)\s*m/); if(hr||mn) return (hr?+hr[1]:0)+(mn?+mn[1]/60:0);
  const n=parseFloat(v.replace(/[^0-9.]/g,'')); if(!(n>0)) return NaN; return n>1440? n/3600 : n>24? n/60 : n; }
const hmh = h => { const m=Math.round(h*60); return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'; };
function importFromUrl(){
  const q=new URLSearchParams(location.search); if(!q.has('weight')&&!q.has('active')&&!q.has('sleep')) return;
  const d=/^\d{4}-\d{2}-\d{2}$/.test(q.get('date')||'')?q.get('date'):today(); const x=day(d); const got=[];
  const num=k=>parseFloat(String(q.get(k)||'').replace(',','.').replace(/[^0-9.]/g,''));
  const w=num('weight'); if(w>20&&w<400){ x.weight=Math.round(w*10)/10; got.push('weight'); }
  const a=num('active'); if(a>=0&&a<10000){ x.active=Math.round(a); got.push('active calories'); }
  const sl=parseSleep(q.get('sleep')); if(sl>0&&sl<16){ x.sleep=Math.round(sl*100)/100; got.push('sleep'); }
  save(); history.replaceState(null,'',location.pathname); if(got.length) toast('Imported '+got.join(', ').replace(/, ([^,]*)$/,' and $1')+' from Health');
}

// ---------- Shell ----------
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2200); }
function renderAll(){ renderDash(); renderLog(); renderPlan(); renderFast(); renderSettings(); }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('main > section').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+b.dataset.tab));
  fastForm=null; ({dash:renderDash,log:renderLog,plan:renderPlan,fast:renderFast,settings:renderSettings})[b.dataset.tab](); window.scrollTo(0,0);
});
importFromUrl(); renderAll();
stravaCallback().then(handled=>{ if(!handled) stravaSync(false); });
</script>
