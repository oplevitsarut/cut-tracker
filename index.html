<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cut Tracker">
<title>Cut Tracker</title>
<style>
:root{
  color-scheme: light;
  --bg:#f2f3f5; --card:#ffffff; --text:#111318; --muted:#666b74; --faint:#9a9fa7; --line:#e6e7eb; --grid:#eceef1;
  --accent:#2a78d6; --accent-soft:#e7f0fb; --good:#11934a; --good-soft:#e3f4ea; --bad:#d23b3b; --bad-soft:#fbe9e9;
  --warn:#b86e00; --warn-soft:#fbf0dc; --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme: dark;
    --bg:#0d0e10; --card:#1a1b1f; --text:#f1f2f3; --muted:#a3a7ae; --faint:#71757d; --line:#2a2c31; --grid:#25272c;
    --accent:#3987e5; --accent-soft:#1a2738; --good:#3fb872; --good-soft:#16281d; --bad:#ec6464; --bad-soft:#2d1818;
    --warn:#e3a23b; --warn-soft:#2b2214; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.head{margin:8px 2px 16px}
.head h1{font-size:30px;line-height:1.15;margin:0;font-weight:750;letter-spacing:-.02em}
.head .sub{color:var(--muted);font-size:15px;margin-top:2px}
h1{font-size:22px;margin:22px 2px 10px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px;font-weight:650;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 .meta{font-size:13px;font-weight:500;color:var(--muted)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
@media (prefers-color-scheme: dark){ .card{border:1px solid var(--line)} }
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid .card{margin:0}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.01em}
.stat .l{font-size:13px;color:var(--muted);margin-top:2px}
.stat .ic{font-size:20px;line-height:1;margin-bottom:8px}
.hero{font-size:48px;font-weight:750;letter-spacing:-.03em;line-height:1}
.hero small{font-size:20px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.muted{background:var(--bg);color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:15px}
.kv + .kv{border-top:1px solid var(--line)}
.kv b{font-weight:650}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:500}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none;font-size:16px}
input:focus,select:focus{border-color:var(--accent)}
button{min-height:46px;padding:10px 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button:active{transform:scale(.98)}
button.ghost{background:var(--accent-soft);color:var(--accent)}
button.small{min-height:36px;padding:6px 12px;font-size:14px}
button.icon{min-height:40px;width:40px;padding:0;flex:0 0 40px;font-size:20px;line-height:1}
ul.list{list-style:none;margin:6px 0 0;padding:0}
ul.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
.x{background:none;color:var(--faint);min-height:36px;padding:4px 8px;font-weight:500}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:none;color:var(--faint);border-radius:0;padding:8px 2px 6px;font-size:11px;font-weight:600;min-height:56px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.bar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden}
.bar > div{height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
svg.chart text.lab{fill:var(--text);font-weight:600;font-size:12px}
.day{display:flex;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day input[type=checkbox]{width:24px;height:24px;min-height:0;flex:none;accent-color:var(--good)}
.day .name{font-weight:600}
.day .dl{font-size:12px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.today{background:var(--accent-soft);border-radius:12px;border-top-color:transparent}
.today + .day{border-top-color:transparent}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-8px);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:9;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tip{position:fixed;z-index:8;background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;
  pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:3px;width:14px;border-radius:2px;vertical-align:3px}
.hidden{display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.cal .h{color:var(--faint);font-size:12px;font-weight:600;padding-bottom:2px}
.cal .c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text)}
.cal .hit{background:var(--good);color:#fff;font-weight:700}
.cal .miss{background:var(--bad-soft);color:var(--bad);font-weight:600}
.cal .rest{color:var(--faint)}
.cal .now{box-shadow:inset 0 0 0 2px var(--accent)}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.big{width:100%;min-height:56px;font-size:17px;border-radius:14px}
.big.done{background:var(--good)}
.big.stop{background:var(--bad)}
.timer{font-size:52px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:4px 0 10px}
.ring{position:relative;width:132px;height:132px;flex:0 0 132px}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .mid b{font-size:26px;letter-spacing:-.02em;line-height:1.1}
.ring .mid span{font-size:12px;color:var(--muted)}
.todo{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.todo .tick{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px}
.todo.ok .tick{background:var(--good);color:#fff;font-weight:800;font-size:15px}
.todo .tt{font-weight:600}
.todo.ok .tt{color:var(--muted)}
.todo .ts{font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;background:none;color:var(--muted);font-size:14px;border-radius:9px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
</style>
</head>
<body>
<main>
  <section id="tab-dash"></section>
  <section id="tab-log" class="hidden"></section>
  <section id="tab-plan" class="hidden"></section>
  <section id="tab-fast" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
</main>
<nav><div class="in">
  <button data-tab="dash" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M12 8v8M8 12h8"/><rect x="3" y="3" width="18" height="18" rx="5"/></svg>Log</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Workout</button>
  <button data-tab="fast"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>Fasting</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</div></nav>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>

<script>
// ---------- Storage ----------
const KEY = 'cuttracker.v1';
const DEFAULT_PLAN = [
  {name:'Zone 2 jog', detail:'35 min easy, able to talk in full sentences', type:'z2', min:35},
  {name:'Strength A', detail:'Squat, push-up/bench, row, plank. 3 sets of 8-12', type:'strength'},
  {name:'Zone 2 jog', detail:'40 min easy', type:'z2', min:40},
  {name:'Strength B', detail:'Deadlift/hinge, overhead press, pulldown, lunges. 3 sets of 8-12', type:'strength'},
  {name:'Rest or walk', detail:'Optional 30 min walk', type:'rest'},
  {name:'Long zone 2 jog', detail:'50-60 min easy', type:'z2', min:50, long:true},
  {name:'Rest', detail:'Recovery day', type:'rest'},
]; // Monday first
const today = () => iso(new Date());
function iso(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function addDays(s,n){ const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function dnum(s){ return new Date(s+'T12:00:00').getTime()/864e5; }
function load(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s) s={};
  s.settings = Object.assign({sex:'male', age:25, height:177, startWeight:113.5, goalWeight:83.5,
    startDate:'2026-11-03', targetDate:'2027-05-03', activity:1.2, calorieTarget:'', proteinTarget:''}, s.settings||{});
  s.days = s.days||{}; s.plan = s.plan||DEFAULT_PLAN.map(p=>({...p})); s.plan.forEach((p,i)=>{ const d=DEFAULT_PLAN[i]; if(p.min===undefined && d && d.min && p.name===d.name && p.detail===d.detail){ p.min=d.min; if(d.long) p.long=true; } });
  s.runs = s.runs||{};
  s.done = s.done||{}; s.fasts = s.fasts||[]; if(s.fastStart===undefined) s.fastStart=null;
  if(!s.settings.age) s.settings.age=25;
  return s;
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Could not save on this device'); } }
function day(d){ return S.days[d] || (S.days[d]={meals:[],workouts:[]}); }

// ---------- Maths ----------
const KCAL_PER_KG = 7700;
const age = () => +S.settings.age || 25;
function bmr(w){ const st=S.settings; return 10*w + 6.25*(+st.height) - 5*age() + (st.sex==='male'?5:-161); }
function tdee(w){ return bmr(w) * (+S.settings.activity||1.2); }
function sortedDates(){ return Object.keys(S.days).sort(); }
function weightOn(d){ // latest weight on or before d
  let w=null; for(const k of sortedDates()){ if(k>d) break; if(S.days[k].weight) w=+S.days[k].weight; }
  return w ?? +S.settings.startWeight;
}
function currentWeight(){ return weightOn(today()); }
function minKcal(){ return S.settings.sex==='male'?1500:1200; }
function calorieTarget(){
  if(+S.settings.calorieTarget) return +S.settings.calorieTarget;
  return Math.max(minKcal(), Math.round((tdee(currentWeight())-750)/50)*50);
}
function proteinTarget(){ return +S.settings.proteinTarget || Math.round(1.6*(+S.settings.goalWeight)/5)*5; }
function eaten(d){ const x=S.days[d]; return x? x.meals.reduce((a,m)=>a+(+m.kcal||0),0):0; }
function protein(d){ const x=S.days[d]; return x? x.meals.reduce((a,m)=>a+(+m.protein||0),0):0; }
function exerciseKcal(d){ // Health active energy wins, otherwise logged workouts
  const x=S.days[d]; if(!x) return 0;
  if(x.active!=null && x.active!=='') return +x.active;
  return x.workouts.reduce((a,w)=>a+(+w.kcal||0),0);
}
function burned(d){ return Math.round(tdee(weightOn(d)) + exerciseKcal(d)); }
function deficit(d){ const x=S.days[d]; if(!x||!x.meals.length) return null; return burned(d)-eaten(d); }
function runsOn(d){ return Object.values(S.runs||{}).filter(r=>r.date===d); }
function z2Minutes(d){ const x=S.days[d]; const logged=x? x.workouts.filter(w=>w.type==='z2').reduce((a,w)=>a+(+w.minutes||0),0):0;
  const strava=runsOn(d).reduce((a,r)=>a+r.secs/60,0); return Math.round(Math.max(logged,strava)); }
function zone2Range(){ const max=220-age(); return [Math.round(max*.6), Math.round(max*.7)]; }
function weightSeries(){ return sortedDates().filter(d=>S.days[d].weight).map(d=>({d, y:+S.days[d].weight})); }
function trend(series){ // 7-day moving average by date
  return series.map(p=>{ const w=series.filter(q=>dnum(q.d)<=dnum(p.d) && dnum(q.d)>dnum(p.d)-7);
    return {d:p.d, y:w.reduce((a,q)=>a+q.y,0)/w.length}; });
}
function weeklyRate(){ // kg per week from trend over last 28 days
  const t=trend(weightSeries()); if(t.length<2) return null;
  const last=t[t.length-1]; const first=t.find(p=>dnum(p.d)>=dnum(last.d)-28)||t[0];
  const days=dnum(last.d)-dnum(first.d); if(days<6) return null;
  return (first.y-last.y)/days*7;
}
function isDone(d){ const x=S.days[d]; return S.done[d]!==undefined ? !!S.done[d] : !!((x && x.workouts.some(w=>w.type!=='other')) || runsOn(d).length); }
function workoutStatus(d){
  const i=(new Date(d+'T12:00:00').getDay()+6)%7, p=S.plan[i];
  if(isDone(d)) return 'hit';
  if(d<S.settings.startDate || d>today()) return '';
  if(p.type==='rest') return 'rest';
  return d<today()?'miss':'';
}
const FAST_H=16;
function fastsEndingOn(d){ return S.fasts.filter(f=>iso(new Date(f.end))===d); }
function longestFast(d){ return Math.max(0,...fastsEndingOn(d).map(f=>(f.end-f.start)/36e5)); }
function fastStatus(d){
  if(longestFast(d)>=FAST_H) return 'hit';
  const first=S.fasts.length? iso(new Date(Math.min(...S.fasts.map(f=>f.end)))) : null;
  if(!first || d<first || d>=today()) return '';
  return 'miss';
}
function streak(fn){ let n=0, d=today(); if(fn(d)!=='hit') d=addDays(d,-1);
  while(true){ const st=fn(d); if(st==='hit') n++; else if(st!=='rest') break; d=addDays(d,-1); if(n>999) break; } return n; }
const calMonth={plan:today().slice(0,7), fast:today().slice(0,7)};
function calendar(key, fn){
  const m=calMonth[key], first=m+'-01', start=mondayOf(first);
  const label=new Date(first+'T12:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});
  let cells=['M','T','W','T','F','S','S'].map(h=>`<div class="h">${h}</div>`).join('');
  for(let i=0;i<42;i++){ const d=addDays(start,i); if(i>=35 && d.slice(0,7)!==m) break;
    if(d.slice(0,7)!==m){ cells+='<div></div>'; continue; }
    cells+=`<div class="c ${fn(d)} ${d===today()?'now':''}">${+d.slice(8)}</div>`; }
  return `<div class="calnav"><button class="ghost icon" onclick="shiftCal('${key}',-1)">‹</button><b>${label}</b><button class="ghost icon" onclick="shiftCal('${key}',1)">›</button></div>
  <div class="cal">${cells}</div>
  <div class="legend"><span><i style="background:${C('--good')};border-radius:50%"></i>Done</span><span><i style="background:${C('--bad-soft')};border-radius:50%;box-shadow:inset 0 0 0 1.5px ${C('--bad')}"></i>Missed</span></div>`;
}
function shiftCal(key,n){ const [y,mo]=calMonth[key].split('-').map(Number); const d=new Date(y,mo-1+n,1);
  calMonth[key]=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); key==='plan'?renderPlan():renderFast(); }
function mondayOf(d){ const x=new Date(d+'T12:00:00'); const k=(x.getDay()+6)%7; return addDays(d,-k); }

// ---------- Charts (plain SVG, sized to the screen so text stays readable) ----------
const C = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CW = () => Math.max(280, Math.min(608, (document.documentElement.clientWidth||375) - 32) - 32);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dlabel = s => { const d=new Date(s+'T12:00:00'); return d.getDate()+' '+MON[d.getMonth()]; };
function niceTicks(lo,hi,n=4){ const span=hi-lo||1, raw=span/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,5,10].map(m=>m*mag).find(st=>span/st<=n)||10*mag; const t=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) t.push(+v.toFixed(6)); return t; }
const tipAttr = t => ` data-tip="${esc(t)}"`;
// series: {points:[{d,y}], color, width, area, dots, end, endFmt, label, faint, tip}
function lineChart(series, {yFmt=v=>v.toFixed(0), xFrom, xTo, H=200, tipFmt}={}){
  const W=CW(), L=34, R=46, T=12, B=24;
  const pts=series.flatMap(s=>s.points); if(!pts.length) return '<p class="muted" style="margin:0">No data yet.</p>';
  const xs=pts.map(p=>dnum(p.d)); let x0=xFrom?dnum(xFrom):Math.min(...xs), x1=xTo?dnum(xTo):Math.max(...xs); if(x1-x0<7) x1=x0+7;
  let lo=Math.min(...pts.map(p=>p.y)), hi=Math.max(...pts.map(p=>p.y)); const pad=Math.max((hi-lo)*.12, Math.abs(hi)*.004, .5); lo-=pad; hi+=pad;
  const ticks=niceTicks(lo,hi,4); lo=Math.min(lo,ticks[0]); hi=Math.max(hi,ticks[ticks.length-1]);
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R), Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g='';
  for(const v of ticks){ g+=`<line x1="${L}" x2="${W-R+8}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C('--grid')}" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${yFmt(v)}</text>`; }
  for(let i=0;i<=3;i++){ const v=x0+(x1-x0)*i/3; g+=`<text x="${X(v)}" y="${H-6}" text-anchor="${i===0?'start':i===3?'end':'middle'}">${dlabel(iso(new Date(v*864e5)))}</text>`; }
  for(const s of series){ if(!s.points.length) continue;
    const P=s.points.map(p=>[X(dnum(p.d)),Y(p.y)]); const path=P.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
    if(s.area) g+=`<path d="${path} L${P[P.length-1][0].toFixed(1)},${Y(lo)} L${P[0][0].toFixed(1)},${Y(lo)} Z" fill="${s.color}" opacity=".10"/>`;
    if(s.width) g+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${s.width}" stroke-linecap="round" stroke-linejoin="round" ${s.faint?'opacity=".55"':''}/>`;
    if(s.dots) g+=P.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="${s.color}" opacity=".35"/>`).join('');
    if(s.label){ const q=P[P.length-1]; g+=`<text x="${Math.min(q[0]+6,W-2)}" y="${q[1]+4}" ${q[0]+6>W-R?'text-anchor="end"':''}>${esc(s.label)}</text>`; }
    if(s.end){ const q=P[P.length-1], last=s.points[s.points.length-1];
      g+=`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="${s.color}" stroke="${C('--card')}" stroke-width="2"/>`+
         `<text class="lab" x="${q[0]+9}" y="${q[1]+4}">${(s.endFmt||yFmt)(last.y)}</text>`; }
    if(s.tip) g+=s.points.map((p,i)=>`<circle cx="${P[i][0]}" cy="${P[i][1]}" r="14" fill="transparent"${tipAttr(dlabel(p.d)+' · '+(tipFmt||yFmt)(p.y))}/>`).join('');
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}</svg>`;
}
function barPath(x,w,yb,yv){ const h=Math.abs(yv-yb); const r=Math.min(4,h,w/2); if(h<0.5) return '';
  if(yv<yb) return `M${x},${yb}V${yv+r}Q${x},${yv} ${x+r},${yv}H${x+w-r}Q${x+w},${yv} ${x+w},${yv+r}V${yb}Z`;
  return `M${x},${yb}V${yv-r}Q${x},${yv} ${x+r},${yv}H${x+w-r}Q${x+w},${yv} ${x+w},${yv-r}V${yb}Z`; }
// bars: [{label, value, color, tip}]
function barChart(bars, {target, targetLabel, fmt=v=>fmt0(v), H=170, every}={}){
  const W=CW(), L=40, R=8, T=18, B=24;
  if(!bars.length) return '<p class="muted" style="margin:0">No data yet.</p>';
  const vals=bars.map(b=>b.value??0).concat(target?[target]:[]);
  let hi=Math.max(0,...vals), lo=Math.min(0,...vals); if(hi===lo) hi=lo+1;
  const ticks=niceTicks(lo,hi,3); lo=Math.min(lo,ticks[0]); hi=Math.max(hi,ticks[ticks.length-1]);
  const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B); const slot=(W-L-R)/bars.length, bw=Math.min(24, slot*.62);
  let g=''; for(const v of ticks) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===0?C('--line'):C('--grid')}" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  const step=every||Math.ceil(bars.length/7); let lastI=-1; bars.forEach((b,i)=>{ if(b.value!=null && b.value!==0) lastI=i; });
  bars.forEach((b,i)=>{ const cx=L+slot*(i+.5), x=cx-bw/2;
    if(b.value!=null) g+=`<path d="${barPath(x,bw,Y(0),Y(b.value))}" fill="${b.color}"/>`;
    if(i===lastI) g+=`<text class="lab" x="${cx}" y="${b.value>=0?Y(b.value)-6:Y(b.value)+14}" text-anchor="middle">${fmt(b.value)}</text>`;
    if((bars.length-1-i)%step===0) g+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${b.label}</text>`;
    g+=`<rect x="${L+slot*i}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent"${tipAttr(b.tip||(b.label+' · '+(b.value==null?'no data':fmt(b.value))))}/>`; });
  if(target) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(target)}" y2="${Y(target)}" stroke="${C('--warn')}" stroke-width="1.5" stroke-linecap="round"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}</svg>`;
}
function ring(pct, color){ const r=56, c=2*Math.PI*r, p=Math.max(0,Math.min(1,pct));
  return `<svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${r}" fill="none" stroke="${C('--bg')}" stroke-width="12"/>
  <circle cx="66" cy="66" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}"/></svg>`; }

  const hrF=hf.length?Math.round(hf.reduce((a,r)=>a+r.hr,0)/hf.length):null, hrL=hl.length?Math.round(hl.reduce((a,r)=>a+r.hr,0)/hl.length):null;
  const diff=pf-pl; const total=runs.reduce((a,r)=>a+r.km,0), longest=Math.max(...runs.map(r=>r.km));
  const mmss=v=>Math.floor(v)+':'+String(Math.round((v%1)*60)).padStart(2,'0');
  return `<div class="card"><h2>Running progress</h2>
    <div class="grid" style="margin-bottom:4px">
      <div class="stat"><div class="v">${fmt1(total)} km</div><div class="l">${runs.length} runs synced</div></div>
      <div class="stat"><div class="v">${fmt1(longest)} km</div><div class="l">Longest run</div></div>
    </div>
    ${runs.length>=8?`<p style="font-size:14px;margin:0 0 8px">Last 4 runs: <b>${pace(pl,1)}/km</b>${hrL?` at ${hrL} bpm`:''}, vs first 4: ${pace(pf,1)}/km${hrF?` at ${hrF} bpm`:''}.
      ${diff>5?`<span class="good">${pace(diff,1)} faster per km.</span>`:diff<-5?'<span class="muted">Slower so far, which is normal early on or in heat.</span>':'<span class="muted">About the same so far.</span>'}</p>`:''}
    <div style="font-weight:600;margin:14px 0 6px">Km per week</div>${barChart(wkm,{fmt:v=>fmt1(v), every:3})}
    <div style="font-weight:600;margin:16px 0 6px">Pace per run <span class="muted" style="font-weight:500;font-size:13px">min/km · lower is faster</span></div>
    ${lineChart([{points:pts,color:C('--accent'),dots:true,tip:true},{points:avg,color:C('--accent'),width:2.5,end:true}],{yFmt:mmss, tipFmt:v=>mmss(v)+' /km'})}
    <p class="muted" style="font-size:12px;margin:6px 0 0">In zone 2, getting faster at the same heart rate is the sign your fitness is improving.</p>
    <ul class="list">${runs.slice(-5).reverse().map(r=>`<li><span>${r.date.slice(5).replace('-','/')} · ${fmt1(r.km)} km</span><span class="muted">${pace(r.secs,r.km)}/km${r.hr?` · ${r.hr} bpm`:''}</span></li>`).join('')}</ul>
  </div>`;
}

function importFromUrl(){
  const q=new URLSearchParams(location.search); if(!q.has('weight')&&!q.has('active')) return;
  const d=/^\d{4}-\d{2}-\d{2}$/.test(q.get('date')||'')?q.get('date'):today(); const x=day(d); const got=[];
  const num=k=>parseFloat(String(q.get(k)||'').replace(',','.').replace(/[^0-9.]/g,''));
  const w=num('weight'); if(w>20&&w<400){ x.weight=Math.round(w*10)/10; got.push('weight'); }
  const a=num('active'); if(a>=0&&a<10000){ x.active=Math.round(a); got.push('active calories'); }
  save(); history.replaceState(null,'',location.pathname); if(got.length) toast('Imported '+got.join(' and ')+' from Health');
}

// ---------- Shell ----------
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2200); }
function renderAll(){ renderDash(); renderLog(); renderPlan(); renderFast(); renderSettings(); }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('main > section').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+b.dataset.tab));
  fastForm=null; ({dash:renderDash,log:renderLog,plan:renderPlan,fast:renderFast,settings:renderSettings})[b.dataset.tab](); window.scrollTo(0,0);
});
importFromUrl(); renderAll();
stravaCallback().then(handled=>{ if(!handled) stravaSync(false); });
</script>
</body>
